version: 2

sources:
  - name: raw_marketing
    description: "Raw marketing advertising data used as input for dbt transformations."
    schema: main

    config:
      loaded_at_field: "cast(loaded_at as timestamp)"

      freshness:
        warn_after:
          count: 12
          period: hour

        error_after:
          count: 24
          period: hour

    tables:
      - name: meta_ads
        description: "Raw advertising performance data from Meta Ads."

      - name: applovin_ads
        description: "Raw advertising performance data from AppLovin Ads."

      - name: campaign_status
        description: "Current campaign status information used for snapshot history."