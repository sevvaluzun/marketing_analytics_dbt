name: dbt CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.5 dbt-duckdb==1.11.0

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          marketing_analytics_dbt:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: dev.duckdb
                threads: 4
          EOF

      - name: Validate dbt project
        run: dbt debug

      - name: Load seed data
        run: dbt seed --full-refresh

      - name: Run dbt build
        run: dbt build --full-refresh --exclude resource_type:seed